<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Interactive Comments Section</title>
</head>
<body>
    <main>
    </main>
    <dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-title">
        <h2 class="delete-dialog-title" id="delete-title">Delete comment</h2>
        <p class="delete-dialog-text">
            Are you sure you want to delete this comment? This will remove the comment and can't be undone.
        </p>
        <div class="delete-dialog-actions">
            <button class="dialog-btn dialog-btn-cancel" data-action="cancel" type="button">No, cancel</button>
            <button class="dialog-btn dialog-btn-confirm" data-action="delete" type="button">Yes, delete</button>
        </div>
</dialog>
<script src="script.js"></script>
</body>
</html>
