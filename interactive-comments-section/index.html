<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Interactive Comments Section</title>
</head>
<body>
    <main>
      <article class="comment">
        <div class="comment__header">
            <img class="comment__avatar" src="" alt="">
            <span class="comment__username"></span>
            <span class="comment__date"></span>
        </div>

        <p class="comment__content"></p>

        <div class="comment__footer">
            <div class="comment__score">
                <button class="comment__score-btn comment__score-btn--plus">+</button>
                <span class="comment__score-count"></span>
                <button class="comment__score-btn comment__score-btn--minus">-</button>
            </div>

            <button class="comment__reply-btn">
                <img src="" alt="">
                <span>Reply</span>
            </button>
        </div>
     </article>
    </main>
<script src="script.js"></script>
</body>
</html>
