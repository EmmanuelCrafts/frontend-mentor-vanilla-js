<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator App</title>
</head>
<body data-theme="1">
    <main>
        <div class="theme-toggle">
            <div class="title">
                <p>calc</p  >
            </div>
            <div class="theme-container">
                <p>THEME</p>
                <div class="toggle-container">
                   <div class="toggle-circle-container">
                       <div class="toggle-circle pos-1"></div>
                   </div>
                   <!-- data attributes -->
                   <div class="number-toggles">
                       <span data-theme="1" class="active">1</span>
                       <span data-theme="2">2</span>
                       <span data-theme="3">3</span>
                   </div>
                   </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="display">
                <div class="display-screen">
                    <p class="display-value"></p>
                </div>
            </div>
            <div class="buttons">
                <div class="btn-inputs">
                    <button class="button seven" data-number="7">7</button>
                    <button class="button eight" data-number="8">8</button>
                    <button class="button nine" data-number="9">9</button>
                    <button class="button DEL" data-action="delete">DEL</button>
                    <button class="button four" data-number="4">4</button>
                    <button class="button five" data-number="5">5</button>
                    <button class="button six" data-number="6">6</button>
                    <button class="button plus" data-action="add">+</button>
                    <button class="button one" data-number="1">1</button>
                    <button class="button two" data-number="2">2</button>
                    <button class="button three" data-number="3">3</button>
                    <button class="button minus" data-action="subtract">-</button>
                    <button class="button dot" data-action="decimal">.</button>
                    <button class="button zero" data-number="0">0</button>
                    <button class="button divide" data-action="divide">/</button>
                    <button class="button multiply" data-action="multiply">x</button>
                </div>
                <div class="button-row">
                  <button class="btn reset" data-action="reset">RESET</button>
                  <button class="btn equal" data-action="equals">=</button>
                </div>
            </div>
    </main>
  <script src="script.js"></script>
</body>
</html>
