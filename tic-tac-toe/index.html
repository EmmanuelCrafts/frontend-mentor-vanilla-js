<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <main>
        <!-- screen 1 -->
        <section  class="menu-screen">
            <div class="logo">
                <img src="assets/logo.svg" alt="logo">
            </div>
            <div class="pick-player">
                <h1 class="pick">PICK PLAYER 1'S MARK</h1>
                <div class="mark">
                    <div class="player-1">
                        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M15.002 1.147 32 18.145 48.998 1.147a3 3 0 0 1 4.243 0l9.612 9.612a3 3 0 0 1 0 4.243L45.855 32l16.998 16.998a3 3 0 0 1 0 4.243l-9.612 9.612a3 3 0 0 1-4.243 0L32 45.855 15.002 62.853a3 3 0 0 1-4.243 0L1.147 53.24a3 3 0 0 1 0-4.243L18.145 32 1.147 15.002a3 3 0 0 1 0-4.243l9.612-9.612a3 3 0 0 1 4.243 0Z" fill="#A8A8A8" fill-rule="evenodd"/></svg>
                    </div>
                    <div class="player-2" >
                        <svg  viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M32 0c17.673 0 32 14.327 32 32 0 17.673-14.327 32-32 32C14.327 64 0 49.673 0 32 0 14.327 14.327 0 32 0Zm0 18.963c-7.2 0-13.037 5.837-13.037 13.037 0 7.2 5.837 13.037 13.037 13.037 7.2 0 13.037-5.837 13.037-13.037 0-7.2-5.837-13.037-13.037-13.037Z" fill="#1A2A33"/></svg>
                    </div>
                </div>
                <p class="turn">REMEMBER : X GOES FIRST</p>
            </div>
            <div class="buttons">
                <div class="vs-cpu">
                <p>NEW GAME (VS CPU)</p>
                </div>
                <div class="vs-player">
                    <p>NEW GAME (VS PLAYER)</p>
                </div>
            </div>
        </section>
        <!-- Screen 2: Game board -->
    <section id="game-screen" class="screen board-container">
        <div class="menu">
            <img src="assets/logo.svg" alt="logo">
            <div class="turn-container">
                <div class="player-turn">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M15.002 1.147 32 18.145 48.998 1.147a3 3 0 0 1 4.243 0l9.612 9.612a3 3 0 0 1 0 4.243L45.855 32l16.998 16.998a3 3 0 0 1 0 4.243l-9.612 9.612a3 3 0 0 1-4.243 0L32 45.855 15.002 62.853a3 3 0 0 1-4.243 0L1.147 53.24a3 3 0 0 1 0-4.243L18.145 32 1.147 15.002a3 3 0 0 1 0-4.243l9.612-9.612a3 3 0 0 1 4.243 0Z" fill="#A8A8A8" fill-rule="evenodd"/></svg>
                </div>
                <p>TURN</p>
            </div>
            <div class="restart">
              <img src="assets/icon-restart.svg" alt="restart">
            </div>
        </div>
      <div class="board">
        <div class="cell" data-cell="0"></div>
        <div class="cell" data-cell="1"></div>
        <div class="cell" data-cell="2"></div>
        <div class="cell" data-cell="3"></div>
        <div class="cell" data-cell="4"></div>
        <div class="cell" data-cell="5"></div>
        <div class="cell" data-cell="6"></div>
        <div class="cell" data-cell="7"></div>
        <div class="cell" data-cell="8"></div>
      </div>
      <div class="scores-container">
            <div class="x-score scores">
                <p class="player-x">X (YOU)</p>
                <p class="score">0</p>
            </div>
            <div class="draw scores">
                <p class="ties">TIES</p>
                <p class="score">0</p>
            </div>
            <div class="o-score scores">
                <p class="player-o">O (CPU)</p>
                <p class="score">0</p>
            </div>
      </div>
    </section>
        
    </main>
</body>
</html>
